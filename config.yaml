# netgw 默认配置模板（发行包自带；安装后修改 /etc/netgw/config.yaml）。
server:
  listen: "0.0.0.0:8000"       # 直接监听地址
  read_header_timeout: 10s     # 读取请求头的期限
  # 同时配置以下两项即启用 HTTPS（TLS 在网关终止，证书建议使用绝对路径）：
  # tls_cert: "/etc/netgw/cert.pem"
  # tls_key: "/etc/netgw/key.pem"

http:
  connect_timeout: 5s          # 连接后端超时
  # HTTPS 后端为自签名证书时设为 true（跳过证书校验，仅建议测试环境）。
  tls_skip_verify: false

# 默认后端 TCP 地址：连接未命中任何 HTTP 前缀路由时，整条连接原始透传。
backend: "127.0.0.1:8080"

# 可选的 HTTP 路径前缀路由（最长前缀优先）。
# 条目支持两种写法：
#   "/path": "127.0.0.1:8080"     # 简写：透明转发，前缀保留
#   "/path":                      # 完整：可配置剥掉前缀
#     backend: "127.0.0.1:8080"
#     strip_prefix: true         # /path/x → 后端收到 /x
# routes:
#   http:
#     "/files":
#       backend: "127.0.0.1:8080"
#       strip_prefix: true

logging:
  level: "info"                # debug / info / warn / error
